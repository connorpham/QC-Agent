repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c 'cd backend && uv run ruff check . && uv run ruff format --check .'
        language: system
        pass_filenames: false
        files: ^backend/
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && uv run mypy app'
        language: system
        pass_filenames: false
        files: ^backend/
      - id: frontend
        name: frontend lint and format
        entry: bash -c 'cd frontend && pnpm lint && pnpm format'
        language: system
        pass_filenames: false
        files: ^frontend/
