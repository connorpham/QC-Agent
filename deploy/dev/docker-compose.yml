services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qc
      POSTGRES_PASSWORD: qc   # local development only
      POSTGRES_DB: qc_agent
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc -d qc_agent"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
